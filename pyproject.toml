[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cellar-battery-dispatch-lab"
version = "1.0.0"
description = "Physical battery dispatch and forecast-value replay for Denmark"
requires-python = ">=3.11"
dynamic = ["dependencies"]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
[tool.setuptools.packages.find]
include = ["cellar*"]
[project.scripts]
cellar = "cellar.cli:main"
